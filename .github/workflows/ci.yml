name: CI Quality Gates

on:
  pull_request:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  push:
    branches: [main]

jobs:
  coverage-policy-guard:
    name: Coverage Policy (>= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/verify_coverage_floors.py && python -m unittest scripts/test_verify_coverage_floors.py

  backend-quality:
    name: Backend Lint, Typecheck & Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rankit
          POSTGRES_USER: rankit
          POSTGRES_PASSWORD: rankit_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rankit:rankit_dev_password@localhost:5432/rankit
      TEST_DATABASE_URL: postgresql://rankit:rankit_dev_password@localhost:5432/rankit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Ruff lint and format check
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy strict typecheck
        working-directory: backend
        run: uv run mypy config apps
      - name: Run unit tests
        working-directory: backend
        run: uv run pytest -m unit
      - name: Run integration tests against PostgreSQL
        working-directory: backend
        run: uv run pytest -m integration
      - name: Enforce full coverage gate
        working-directory: backend
        run: uv run pytest --cov=apps --cov-report=term-missing

  frontend-quality:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Prettier format check
        working-directory: frontend
        run: npm run format:check
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Vitest unit & integration coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Next.js production build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Full-Stack Docker & Playwright E2E
    runs-on: ubuntu-latest
    needs: [coverage-policy-guard, backend-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Boot Docker Compose stack
        run: docker compose up -d --build --wait
      - name: Install Playwright & Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
